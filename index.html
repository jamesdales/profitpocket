    <script>
      // Applies the saved app colour before the first paint (see src/theme/applyTheme.ts).
      try {
        var vars = JSON.parse(localStorage.getItem('pp-theme') || 'null')
        if (vars && typeof vars === 'object') {
          for (var k in vars) if (k.indexOf('--pp-') === 0) document.documentElement.style.setProperty(k, String(vars[k]))
          if (vars['--pp-bg']) document.querySelector('meta[name="theme-color"]').setAttribute('content', vars['--pp-bg'])
        }
      } catch (e) {}
    </script>
